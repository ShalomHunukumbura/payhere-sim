[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payhere-sim"
version = "0.1.0"
description = "Test PayHere (Sri Lanka) integrations locally: signed notifications, safety checks for your notify_url, and a local checkout page."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Shalom Hunukumbura" }]
keywords = ["payhere", "sri lanka", "payments", "webhook", "testing", "idempotency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.scripts]
payhere-sim = "payhere_sim.cli:main"

[project.urls]
Homepage = "https://github.com/ShalomHunukumbura/payhere-sim"
Issues = "https://github.com/ShalomHunukumbura/payhere-sim/issues"

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/payhere_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
